<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Rounded squircle clipping path (standard macOS desktop icon: rx=128 for 512x512) -->
    <clipPath id="squircle_clip">
      <rect width="512" height="512" rx="128" />
    </clipPath>

    <!-- Subtle gradient of light and shadow based on the app background palette -->
    <linearGradient id="bg_gradient" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22222a" />
      <stop offset="45%" stop-color="#141416" />
      <stop offset="100%" stop-color="#0a0a0d" />
    </linearGradient>
  </defs>

  <g clip-path="url(#squircle_clip)">
    <!-- App background with slight light and shadow gradient -->
    <rect width="512" height="512" fill="url(#bg_gradient)" />

    <!-- Play button (rounded triangle) in app teal (#019D9C), scaled 1.5x -->
    <path d="M 163 91 L 163 271 Q 163 316 202 293.5 L 358 203.5 Q 397 181 358 158.5 L 202 68.5 Q 163 46 163 91 Z" fill="#019D9C" />

    <!-- Butler Bow Tie in app teal (#019D9C), scaled 1.5x -->
    <!-- Left Wing -->
    <path d="M 217 406 C 172 403 124 385 94 370 Q 82 364 82 379 Q 89.5 421 82 463 Q 82 478 94 472 C 124 457 172 439 217 436 Z" fill="#019D9C" />
    <!-- Right Wing -->
    <path d="M 295 406 C 340 403 388 385 418 370 Q 430 364 430 379 Q 422.5 421 430 463 Q 430 478 418 472 C 388 457 340 439 295 436 Z" fill="#019D9C" />
    <!-- Center Knot -->
    <rect x="229" y="382" width="54" height="78" rx="15" fill="#019D9C" />
  </g>
</svg>
