<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- macOS standard desktop icon drop shadow -->
    <filter id="mac_shadow" x="-20%" y="-20%" width="140%" height="145%">
      <!-- Ambient contact shadow -->
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.25" />
      <!-- Main directional key light shadow -->
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.30" />
    </filter>

    <!-- Subtle gradient based on app background palette -->
    <linearGradient id="bg_gradient" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22222a" />
      <stop offset="45%" stop-color="#141416" />
      <stop offset="100%" stop-color="#0a0a0d" />
    </linearGradient>

    <!-- Subtle rim highlight for contrast on dark desktop backgrounds -->
    <linearGradient id="rim_gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <!-- macOS icon rounded rectangle clipping path (rx=92 for 412x412 at 50,50 per Apple HIG) -->
    <clipPath id="icon_clip">
      <rect x="50" y="50" width="412" height="412" rx="92" />
    </clipPath>
  </defs>

  <!-- Shadow caster beneath the icon -->
  <rect x="50" y="50" width="412" height="412" rx="92" fill="#0a0a0d" filter="url(#mac_shadow)" />

  <!-- Clipped icon content -->
  <g clip-path="url(#icon_clip)">
    <!-- App background gradient -->
    <rect x="50" y="50" width="412" height="412" fill="url(#bg_gradient)" />

    <!-- Play button (rounded triangle) in app teal (#019D9C) -->
    <path d="M 186.1 115.5 L 186.1 250.5 Q 186.1 284.2 215.4 267.4 L 332.4 199.9 Q 361.6 183.0 332.4 166.1 L 215.4 98.6 Q 186.1 81.8 186.1 115.5 Z" fill="#019D9C" />

    <!-- Butler Bow Tie in app teal (#019D9C) -->
    <!-- Left Wing -->
    <path d="M 214.0 358.8 C 180.7 356.5 145.1 343.0 122.9 331.8 Q 114.0 327.2 114.0 338.5 Q 119.6 370.0 114.0 401.5 Q 114.0 412.8 122.9 408.2 C 145.1 397.0 180.7 383.5 214.0 381.2 Z" fill="#019D9C" />
    <!-- Right Wing -->
    <path d="M 298.0 358.8 C 331.3 356.5 366.9 343.0 389.1 331.8 Q 398.0 327.2 398.0 338.5 Q 392.4 370.0 398.0 401.5 Q 398.0 412.8 389.1 408.2 C 366.9 397.0 331.3 383.5 298.0 381.2 Z" fill="#019D9C" />
    <!-- Center Knot (width=44, height=64, rx=12; 20px gap to wings on each side) -->
    <rect x="234" y="338" width="44" height="64" rx="12" fill="#019D9C" />
  </g>

  <!-- Inner rim highlight along the rounded rectangle silhouette -->
  <rect x="50.75" y="50.75" width="410.5" height="410.5" rx="91.25" fill="none" stroke="url(#rim_gradient)" stroke-width="1.5" />
</svg>
